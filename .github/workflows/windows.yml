name: windows
on:
  push:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Claude Code (native)
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: claude --version
      - run: npm run build
      - name: End-to-end test on Windows
        run: npm test
        env:
          BIPOLAR_E2E_DIR: ${{ github.workspace }}/e2e-out
          SWITCHBOARD_ONSCREEN: '1'
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence
          path: |
            e2e-out/*/*.png
            e2e-out/*/*.txt
      - if: success()
        uses: actions/upload-artifact@v5
        with:
          name: Bipolar-Windows-x64
          path: dist/Bipolar-win32-x64
